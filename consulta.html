    if (!c || c.length < 100) { e.innerText = "❌ Senha incorreta"; return; }
    document.getElementById("loginBox").style.display = "none";
    document.write(c);
    document.close();
  } catch(err) {
    e.innerText = "❌ Senha incorreta ou ficheiro corrompido";
  }
}
</script>
</body>
</html>
