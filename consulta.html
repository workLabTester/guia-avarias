function desencriptar() {
  var s = document.getElementById("senhaInput").value;
  var e = document.getElementById("erroMsg");
  if (!s) { e.innerText = "❌ Digite a senha"; return; }
  try {
    var d = CryptoJS.AES.decrypt(ENCRYPTED_CODE, s);
    var c = d.toString(CryptoJS.enc.Utf8);
    if (!c || c.length < 100) { e.innerText = "❌ Senha incorreta"; return; }
    document.getElementById("loginBox").style.display = "none";
    document.write(c);
    document.close();
  } catch(err) {
    e.innerText = "❌ Senha incorreta ou ficheiro corrompido";
  }
}
