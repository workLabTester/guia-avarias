<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Avarias - Consulta</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a3a4f">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: #e9ecef; color: #000; }
        
        /* Login */
        .login-box { max-width: 350px; margin: 60px auto; background: white; border-radius: 20px; padding: 30px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        .login-box h2 { color: #1a3a4f; margin-bottom: 15px; font-size: 20px; }
        .login-box input { width: 100%; padding: 14px; margin: 8px 0; border: 2px solid #ced4da; border-radius: 10px; font-size: 16px; text-align: center; }
        .login-box button { width: 100%; padding: 14px; background: #17a2b8; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .erro { color: #dc3545; font-size: 12px; margin-top: 8px; }
        
        .container { max-width: 800px; margin: 0 auto; padding: 15px; }
        .voltar { text-align: center; margin: 15px 0; }
        .voltar a { color: #17a2b8; text-decoration: none; font-size: 13px; font-weight: 600; cursor: pointer; }
        .total { text-align: center; font-size: 12px; color: #666; margin: 10px 0; }
        .hidden { display: none; }
        
        /* ========== ESTILO EXATO DE IMPRESSÃO ========== */
        .ncr-pagina {
            background: white;
            max-width: 750px;
            margin: 0 auto 20px auto;
            padding: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
            border-radius: 4px;
        }
        
        /* Cabeçalho estilo impressão */
        .cabecalho-print {
            border: 3px solid #1a3a4f;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        .cabecalho-topo {
            background: #1a3a4f;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .cabecalho-logo {
            width: 70px; height: 70px;
            background: white; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            font-weight: bold; font-size: 20px; color: #1a3a4f;
        }
        .cabecalho-titulo h2 { font-size: 20px; font-weight: bold; color: white; line-height: 1.3; }
        .cabecalho-titulo p { font-size: 12px; color: #c7b27b; margin-top: 4px; }
        .cabecalho-dados {
            padding: 10px 15px;
            background: white;
            display: flex;
            flex-wrap: wrap;
            gap: 5px 30px;
            font-size: 12px;
            color: #1a3a4f;
            border-bottom: 1px solid #e0e0e0;
        }
        .cabecalho-dados span { white-space: nowrap; }
        
        /* Secções */
        .secao {
            border: 1px solid #ccc;
            background: #f8f9fa;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 0;
        }
        .secao-titulo {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 10px;
            border-left: 3px solid #c7b27b;
            padding-left: 10px;
            color: #1a3a4f;
        }
        
        /* Campos */
        .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
        .field-group { flex: 1; min-width: 150px; margin-bottom: 4px; }
        .field-group label { font-weight: 600; font-size: 10px; display: block; margin-bottom: 2px; color: #2c3e50; }
        .field-group .valor { font-size: 13px; border-bottom: 1px dotted #ccc; padding: 2px 0; min-height: 18px; color: #000; }
        
        /* Textareas */
        .texto-cheio {
            border: 1px solid #999;
            background: white;
            padding: 8px;
            font-size: 13px;
            line-height: 1.5;
            white-space: pre-wrap;
            min-height: 60px;
            color: #000;
        }
        
        /* Assinaturas */
        .assinaturas { display: flex; gap: 20px; margin-top: 20px; }
        .assinatura { flex: 1; text-align: center; }
        .assinatura .linha { border-bottom: 1px solid #000; height: 35px; margin-bottom: 4px; }
        .assinatura .nome { font-size: 12px; font-weight: bold; }
        .assinatura .cargo { font-size: 10px; color: #666; }
        
        /* Fotos */
        .fotos-area { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0; }
        .foto-item { width: 150px; border: 1px solid #ccc; padding: 4px; background: white; }
        .foto-item img { width: 100%; height: 120px; object-fit: contain; background: #f0f0f0; }
        .foto-item .legenda { font-size: 9px; text-align: center; padding: 2px; }
        
        /* Botão expandir */
        .btn-expand { background: #1a3a4f; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; width: 100%; margin: 8px 0; }
        
        @media print {
            body { background: white; padding: 0; }
            .ncr-pagina { box-shadow: none; max-width: 100%; padding: 5px; }
            .btn-expand, .voltar, .total { display: none; }
            .secao { page-break-inside: avoid; }
            @page { margin: 0.6cm; size: A4; }
        }
    </style>
</head>
<body>

<div id="telaLogin">
    <div class="login-box">
        <h2>🔐 GESTÃO DE AVARIAS</h2>
        <p style="color:#666;font-size:13px;">Consulta de NCRs</p>
        <input type="text" id="clienteInput" placeholder="Nome do Cliente" value="" autocomplete="off">
        <button onclick="consultar()">📋 Ver NCRs</button>
        <div id="erroLogin" class="erro"></div>
    </div>
</div>

<div id="telaResultados" class="hidden">
    <div class="container" id="listaNCRs"></div>
    <div class="total" id="totalNCRs"></div>
    <div class="voltar"><a onclick="voltar()">← Consultar outro cliente</a></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SUPABASE_URL = "https://aluqpenxefjfryunzlsm.supabase.co";
var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFsdXFwZW54ZWZqZnJ5dW56bHNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4MDY5NzMsImV4cCI6MjA5NDM4Mjk3M30.KUJKZd3Oc9ytFUUrLaK-W9ckWkQQS2kXTSBMU9x50tM";
var supabaseClient = null;
var params = new URLSearchParams(window.location.search);
var clienteURL = params.get('cliente');
if (clienteURL) document.getElementById('clienteInput').value = clienteURL;

function voltar() {
    document.getElementById('telaLogin').classList.remove('hidden');
    document.getElementById('telaResultados').classList.add('hidden');
    document.getElementById('clienteInput').value = '';
}

async function consultar() {
    var cliente = document.getElementById('clienteInput').value.trim();
    if (!cliente) { document.getElementById('erroLogin').innerText = '❌ Digite o nome do cliente'; return; }
    try {
        supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        var resp = await supabaseClient.from('ncrs').select('*').ilike('clientenome', '%' + cliente + '%').order('datacriacao', { ascending: false }).limit(50);
        if (resp.data && resp.data.length > 0) {
            document.getElementById('telaLogin').classList.add('hidden');
            document.getElementById('telaResultados').classList.remove('hidden');
            mostrarNCRs(resp.data);
        } else {
            document.getElementById('erroLogin').innerText = '❌ Nenhum NCR encontrado';
        }
    } catch(e) { document.getElementById('erroLogin').innerText = '❌ Erro de conexão'; }
}

function mostrarNCRs(ncrs) {
    var html = '';
    ncrs.forEach(function(n) {
        var dataF = n.dataanalise ? new Date(n.dataanalise + 'T00:00:00').toLocaleDateString('pt-PT') : '-';
        var dataV = n.dataverificacao ? new Date(n.dataverificacao + 'T00:00:00').toLocaleDateString('pt-PT') : '';
        var dataC = n.datacompra ? new Date(n.datacompra + 'T00:00:00').toLocaleDateString('pt-PT') : '';
        
        html += '<div class="ncr-pagina">';
        
        // ========== CABEÇALHO IMPRESSÃO ==========
        html += '<div class="cabecalho-print">';
        html += '<div class="cabecalho-topo">';
        html += '<div class="cabecalho-logo">GA</div>';
        html += '<div class="cabecalho-titulo"><h2>GESTÃO DE AVARIAS - NCR</h2><p>Consultoria e Fiscalização | Instalações Técnicas Especiais</p></div>';
        html += '</div>';
        html += '<div class="cabecalho-dados">';
        html += '<span><strong>🏢 Cliente:</strong> ' + (n.clientenome || '-') + '</span>';
        html += '<span><strong>📄 NCR:</strong> ' + (n.id || '-') + '</span>';
        html += '</div>';
        html += '<div class="cabecalho-dados">';
        html += '<span><strong>🔍 Técnico:</strong> ' + (n.tecnico || '-') + '</span>';
        html += '<span><strong>📍 Local:</strong> ' + (n.localinstal || '-') + '</span>';
        html += '</div>';
        html += '<div class="cabecalho-dados">';
        html += '<span><strong>⚙️ Processo:</strong> ' + (n.funcaoprocesso || '-') + '</span>';
        html += '<span><strong>📅 Data:</strong> ' + dataF + '</span>';
        html += '</div>';
        html += '</div>';
        
        // ========== EQUIPAMENTO ==========
        html += '<div class="secao"><div class="secao-titulo">🔧 EQUIPAMENTO</div>';
        html += '<div class="row">';
        html += '<div class="field-group"><label>Tipo</label><div class="valor">' + (n.tipoequip || '') + '</div></div>';
        html += '<div class="field-group"><label>Marca</label><div class="valor">' + (n.marcaequip || '') + '</div></div>';
        html += '<div class="field-group"><label>Modelo</label><div class="valor">' + (n.modeloequip || '') + '</div></div>';
        html += '</div>';
        html += '<div class="row">';
        html += '<div class="field-group"><label>Código Ativo</label><div class="valor">' + (n.codigopeca || '') + '</div></div>';
        html += '<div class="field-group"><label>Designação</label><div class="valor">' + (n.nomepeca || '') + '</div></div>';
        html += '<div class="field-group"><label>Nº Série</label><div class="valor">' + (n.serieequip || '') + '</div></div>';
        html += '</div>';
        html += '<div class="row">';
        html += '<div class="field-group"><label>Ano Fabrico</label><div class="valor">' + (n.anofabrico || '') + '</div></div>';
        html += '<div class="field-group"><label>Data Instalação</label><div class="valor">' + (dataC || '') + '</div></div>';
        html += '<div class="field-group"><label>Garantia</label><div class="valor">' + (n.sobgarantia || '') + '</div></div>';
        html += '</div>';
        html += '</div>';
        
        // ========== DESCRIÇÃO ==========
        html += '<div class="secao"><div class="secao-titulo">📝 DESCRIÇÃO</div>';
        html += '<div class="texto-cheio">' + (n.descavaria || '') + '</div>';
        html += '<div style="margin-top:8px;"><label style="font-weight:600;font-size:10px;">Impacto</label><div class="texto-cheio">' + (n.impacto || '') + '</div></div>';
        html += '</div>';
        
        // ========== AÇÕES ==========
        html += '<div class="secao"><div class="secao-titulo">🔧 AÇÕES</div>';
        html += '<div class="row">';
        html += '<div class="field-group"><label>Correção Imediata</label><div class="texto-cheio">' + (n.correcaoimediata || '') + '</div></div>';
        html += '<div class="field-group"><label>Ação Preventiva</label><div class="texto-cheio">' + (n.recomendacao || '') + '</div></div>';
        html += '</div>';
        html += '<div class="row">';
        html += '<div class="field-group"><label>Responsável</label><div class="valor">' + (n.respcorrecao || '') + '</div></div>';
        html += '<div class="field-group"><label>Data Limite</label><div class="valor">' + (n.datalimitecorretiva || '') + '</div></div>';
        html += '</div>';
        html += '</div>';
        
        // ========== VERIFICAÇÃO ==========
        html += '<div class="secao"><div class="secao-titulo">✅ VERIFICAÇÃO</div>';
        html += '<div class="row">';
        html += '<div class="field-group"><label>Verificado por</label><div class="valor">' + (n.verificadopor || '') + '</div></div>';
        html += '<div class="field-group"><label>Cargo</label><div class="valor">' + (n.cargoverificador || '') + '</div></div>';
        html += '<div class="field-group"><label>Data</label><div class="valor">' + (dataV || '') + '</div></div>';
        html += '</div>';
        html += '<div class="row">';
        html += '<div class="field-group"><label>Status</label><div class="valor" style="font-weight:bold;color:' + (n.statusncr === 'Fechado' ? '#28a745' : '#856404') + ';">' + (n.statusncr || 'Em andamento') + '</div></div>';
        html += '<div class="field-group"><label>Data Fecho</label><div class="valor">' + (n.datafecho ? new Date(n.datafecho + 'T00:00:00').toLocaleDateString('pt-PT') : '') + '</div></div>';
        html += '</div>';
        html += '</div>';
        
        // ========== OBSERVAÇÕES ==========
        if (n.outrascausas) {
            html += '<div class="secao"><div class="secao-titulo">📌 OBSERVAÇÕES</div>';
            html += '<div class="texto-cheio">' + n.outrascausas + '</div></div>';
        }
        
        // ========== ASSINATURAS ==========
        html += '<div class="secao"><div class="secao-titulo">✍️ ASSINATURAS</div>';
        html += '<div class="assinaturas">';
        html += '<div class="assinatura"><div class="linha"></div><div class="nome">Técnico</div><div class="cargo">(Assinatura)</div></div>';
        html += '<div class="assinatura"><div class="linha"></div><div class="nome">Responsável / Cliente</div><div class="cargo">(Assinatura)</div></div>';
        html += '</div></div>';
        
        html += '</div>'; // fim ncr-pagina
    });
    
    document.getElementById('listaNCRs').innerHTML = html;
    document.getElementById('totalNCRs').innerText = ncrs.length + ' NCR(s) encontrado(s)';
}

document.getElementById('clienteInput').addEventListener('keypress', function(e) { if (e.key === 'Enter') consultar(); });
if (clienteURL) setTimeout(consultar, 500);
</script>
</body>
</html>
