var e=document.getElementById("erroMsg");
if(!s){e.innerText="❌ Digite a senha";return;}

var d=CryptoJS.AES.decrypt(ENCRYPTED_CODE,s);

if(!c.includes("<")&&!c.includes("html")){e.innerText="❌ Senha incorreta";return;}
document.getElementById("loginBox").style.display="none";
var app=document.getElementById("appContainer");
app.style.display="block";
var iframe=document.createElement("iframe");
iframe.style.cssText="width:100%;height:100vh;border:none;overflow:auto;";
iframe.sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads allow-storage-access-by-user-activation";
iframe.allow="localStorage;indexedDB";
app.appendChild(iframe);
var doc=iframe.contentDocument||iframe.contentWindow.document;
doc.open();
doc.write(c);
doc.close();
}catch(err){
e.innerText="❌ Senha incorreta ou ficheiro corrompido";
console.log(err);
}
}
</script>
