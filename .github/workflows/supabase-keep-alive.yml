name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 9 * * 1,4'  # Segundas e Quintas às 9h UTC
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Projeto 1
        run: |
          echo "A fazer ping ao Projeto 1..."
          curl -v --max-time 10 \
            "https://aluqpenxefjfryunzlsm.supabase.co/rest/v1/?apikey=${{ secrets.SUPABASE_ANON_KEY_1 }}" \
            && echo "✅ Projeto 1 ativo" || echo "⚠️ Projeto 1 falhou"

      - name: Ping Projeto 2
        run: |
          echo "A fazer ping ao Projeto 2..."
          curl -v --max-time 10 \
            "https://xcaihvsgirqsxxccgvgr.supabase.co/rest/v1/?apikey=${{ secrets.SUPABASE_ANON_KEY_2 }}" \
            && echo "✅ Projeto 2 ativo" || echo "⚠️ Projeto 2 falhou"
